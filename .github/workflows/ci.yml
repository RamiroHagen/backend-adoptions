name: CI - Tests and Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run functional tests
        run: npm test

      - name: Build Docker image
        run: docker build -t proyecto-backend-adoptions:ci .

      - name: Smoke test Docker image
        run: |
          docker run -d --name backend-ci -p 3000:3000 --env-file .env.example proyecto-backend-adoptions:ci
          sleep 8
          curl -f http://localhost:3000/health
          docker logs backend-ci
          docker rm -f backend-ci
